name: Bug report
description: Something in PrismGEO does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please never paste API keys, cookies or client data; screenshots from data/crawl-debug/ may show your accounts, so check them first.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open … 2. Click … 3. …"
    validations: { required: true }
  - type: dropdown
    id: install
    attributes:
      label: How do you run PrismGEO?
      options: [install script / pnpm bootstrap, pnpm from a git clone, Docker]
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, Ubuntu 24.04…
    validations: { required: true }
  - type: textarea
    id: health
    attributes:
      label: Output of http://localhost:3333/api/health
      description: It shows the PrismGEO version, Node.js version and database schema, nothing else.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Relevant lines from data/logs/prismgeo.log
      render: text
