name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version (package.json engines) and the current LTS line
        node: ["22.13.0", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build
        run: pnpm --filter @prismgeo/web build
        env:
          PRISMGEO_DB_PATH: ${{ runner.temp }}/ci-build.db
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Docker image tag matches the locked Playwright version
        run: |
          image="$(grep -oP 'playwright:v\K[0-9.]+' Dockerfile | head -1)"
          locked="$(grep -oP '^  playwright@\K[0-9.]+(?=:)' pnpm-lock.yaml | head -1)"
          echo "Dockerfile: $image, pnpm-lock.yaml: $locked"
          test -n "$image" && test "$image" = "$locked"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: prismgeo:ci
      - name: Starts and reports healthy
        run: |
          docker run -d --name prismgeo --init -p 127.0.0.1:3333:3333 prismgeo:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3333/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs prismgeo
          exit 1
      - name: Runs as pwuser
        run: test "$(docker exec prismgeo id -un)" = "pwuser"

  install:
    # A fresh machine following the README quick start: clone, install, download the browser,
    # build, start, and check that the dashboard answers.
    name: Fresh install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the browser
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm --filter @prismgeo/crawler exec playwright install --with-deps chromium
          else
            pnpm browsers
          fi
      - run: pnpm build
      - name: Starts, answers and opens the setup wizard
        run: |
          pnpm start > start.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3333/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3333/api/health
          curl -fsSL -o setup.html -w "setup page: %{http_code}\n" http://127.0.0.1:3333/setup
          grep -q "Add a client" setup.html
      - name: Server log
        if: always()
        run: cat start.log || true
